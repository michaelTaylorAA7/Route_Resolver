<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Resolver — A DNS Story</title>
<style>
  :root{
    --bg-dusk:#1b2a4a;
    --bg-dusk-2:#24365c;
    --street:#3d4b63;
    --street-line:#5b6c88;
    --paper:#f2e9d8;
    --paper-line:#d8cbb0;
    --ink:#2b2420;
    --porch:#ffcf56;
    --bike:#e8543f;
    --cache:#5fbf7a;
    --roof:#c0503f;
    --screen-bg:#10241a;
    --screen-fg:#57ffa0;
    --shell:#e8543f;
    --shell-dark:#b83a2c;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 20% 15%, #24365c 0%, #14203a 55%, #0e1729 100%);
    color:var(--ink);
    font-family:Verdana, Geneva, sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  .display{
    color:#fff;
    font-family:'Courier New', ui-monospace, monospace;
    font-weight:900;
    letter-spacing:1px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.45);
  }

  /* ---------- Cartridge / bezel shell ---------- */
  #cartridge{
    position:relative;
    width:900px;
    max-width:96vw;
    height:660px;
    max-height:94vh;
    background: linear-gradient(180deg, var(--shell) 0%, var(--shell-dark) 100%);
    border-radius:26px;
    padding:18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), inset 0 2px 0 rgba(255,255,255,0.25);
    display:flex;
    flex-direction:column;
  }

  #cartridge::before{
    content:"ROUTE RESOLVER";
    position:absolute;
    top:6px; left:26px;
    font-size:11px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.75);
    font-family:'Courier New', monospace;
    font-weight:700;
  }

  #screen-area{
    flex:1;
    background: var(--bg-dusk);
    border-radius:14px;
    border: 4px solid var(--shell-dark);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.15), inset 0 10px 30px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .scene{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
  }
  .scene.active{ display:flex; }

  /* ================= TITLE SCREEN ================= */
  #scene-title{
    align-items:center; justify-content:center; text-align:center; gap:22px;
    background:
      linear-gradient(180deg, #1b2a4a 0%, #24365c 60%, #3d4b63 100%);
  }
  #scene-title .logo{
    font-size:44px;
    color:var(--porch);
  }
  #scene-title .subtitle{
    color:#cbd8ee;
    font-family: Verdana, sans-serif;
    font-size:14px;
    letter-spacing:1px;
    max-width:420px;
  }
  .blink{ animation: blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .press-start{
    color:var(--paper);
    font-family:'Courier New', monospace;
    font-size:16px;
    letter-spacing:2px;
  }
  .big-btn{
    font-family:'Courier New', monospace;
    font-weight:900;
    letter-spacing:1px;
    font-size:16px;
    background:var(--porch);
    color:var(--ink);
    border:3px solid var(--ink);
    border-radius:8px;
    padding:12px 26px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--shell-dark);
    transition:transform 0.05s ease;
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:none; }
  .big-btn:disabled{ opacity:0.4; cursor:default; box-shadow:none; }
  .big-btn.secondary{ background:var(--paper); }
  .big-btn.green{ background:var(--cache); }

  /* ================= DIALOGUE / CUTSCENE ================= */
  #scene-cutscene{
    justify-content:flex-end;
    background:
      linear-gradient(180deg, #24365c 0%, #3d4b63 65%, #46577a 100%);
  }
  .cutscene-backdrop{
    flex:1;
    display:flex; align-items:center; justify-content:center;
  }
  .badge-frame{
    width:150px; height:150px;
    border-radius:10px;
    background:var(--paper);
    border:5px solid var(--ink);
    padding:8px;
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
  }

  .dialogue-box{
    margin:14px;
    background:var(--paper);
    border:4px solid var(--ink);
    border-radius:10px;
    padding:16px 20px;
    position:relative;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 0 6px rgba(0,0,0,0.06);
    background-image: repeating-linear-gradient( var(--paper), var(--paper) 27px, var(--paper-line) 28px );
  }
  .speaker-tag{
    display:inline-block;
    font-family:'Courier New', monospace;
    font-weight:900;
    font-size:13px;
    letter-spacing:1px;
    background:var(--ink);
    color:var(--paper);
    padding:3px 10px;
    border-radius:5px;
    margin-bottom:8px;
  }
  .dialogue-text{
    font-size:16px;
    line-height:1.5;
    min-height:52px;
  }
  .dialogue-footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:10px;
  }
  .advance-hint{
    font-family:'Courier New', monospace;
    font-size:12px;
    color:#6b5f52;
  }

  /* ================= PLAY SCENE ================= */
  .play-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    background:rgba(0,0,0,0.2);
    color:var(--paper);
    font-family:'Courier New', monospace;
    font-size:13px;
    letter-spacing:1px;
  }
  .play-topbar .lvl-name{ color:var(--porch); font-weight:900; }

  .play-body{
    flex:1;
    display:flex;
    gap:12px;
    padding:12px 16px 16px 16px;
    min-height:0;
  }

  /* --- side: today's list --- */
  #route-list-panel{
    width:190px;
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:8px;
    padding:10px;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
    display:flex; flex-direction:column;
    min-height:0;
  }
  #route-list-panel h3{
    margin:0 0 8px 0;
    font-family:'Courier New', monospace;
    font-size:12px;
    letter-spacing:1px;
    border-bottom:2px dashed var(--ink);
    padding-bottom:6px;
  }
  #route-list{
    list-style:none; margin:0; padding:0;
    overflow-y:auto;
    flex:1;
  }
  #route-list li{
    font-family:'Courier New', monospace;
    font-size:13px;
    padding:6px 4px;
    border-bottom:1px dotted var(--paper-line);
    display:flex; align-items:center; gap:6px;
  }
  #route-list li.current{
    background:var(--porch);
    border-radius:4px;
    font-weight:900;
  }
  #route-list li.done{ color:#9a8f80; text-decoration:line-through; }
  #route-list li .tag{
    font-size:9px;
    background:var(--cache);
    color:#0c2a17;
    padding:1px 5px;
    border-radius:4px;
    font-weight:900;
  }

  /* --- center: resolver device --- */
  #resolver-panel{
    width:230px;
    display:flex; flex-direction:column; align-items:center;
    gap:8px;
  }
  #device-svg-wrap{ width:150px; position:relative; margin:0 auto; }
  #resolver-screen{
    position:absolute;
    top:15.5%; left:16%;
    width:68%; height:37%;
    background:var(--screen-bg);
    border-radius:2px;
    font-family:'Courier New', monospace;
    color:var(--screen-fg);
    font-size:10.5px;
    line-height:1.25;
    padding:5px 5px;
    overflow:hidden;
    text-shadow:0 0 4px rgba(87,255,160,0.7);
  }
  #resolver-screen .cursor{ animation: blink 0.8s steps(1) infinite; }
  #resolve-btn{ width:100%; }
  #irl-toggle{
    background:none; border:none; color:#cbd8ee;
    font-family:'Courier New', monospace; font-size:11px;
    text-decoration:underline; cursor:pointer; margin-top:2px;
  }
  #irl-note{
    display:none;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:6px;
    padding:8px;
    font-size:11.5px;
    line-height:1.4;
    max-width:210px;
  }
  #irl-note.show{ display:block; }

  /* --- right: street scene --- */
  #street-panel{
    flex:1;
    background: linear-gradient(180deg, #2c3f66 0%, #354a70 65%, var(--street) 65%, var(--street) 100%);
    border:3px solid var(--ink);
    border-radius:8px;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  .road-dashes{
    position:absolute; left:0; right:0; bottom:34px; height:4px;
    background-image: repeating-linear-gradient(90deg, var(--street-line) 0 24px, transparent 24px 46px);
  }
  #house-slot{
    position:absolute; right:12%; bottom:34px;
    width:150px; text-align:center;
    transition: filter 0.4s ease;
  }
  #house-slot.unknown svg .lit{ fill:#3a4356; }
  #house-slot.unknown svg .wall{ filter:saturate(0.4) brightness(0.8); }
  #house-slot .addr-plate{
    margin-top:2px;
    font-family:'Courier New', monospace;
    font-weight:900;
    font-size:13px;
    background:var(--ink);
    color:var(--paper);
    display:inline-block;
    padding:3px 10px;
    border-radius:5px;
    letter-spacing:0.5px;
  }
  #house-slot .delivered-badge{
    position:absolute; top:-6px; right:6px;
    background:var(--cache); color:#0c2a17;
    font-size:16px; border-radius:50%;
    width:28px; height:28px; display:none;
    align-items:center; justify-content:center;
    border:2px solid var(--ink);
  }
  #house-slot.delivered .delivered-badge{ display:flex; }

  #mailbox-slot{
    position:absolute; left:6%; bottom:34px; width:46px;
  }

  #bike-wrap{
    position:absolute; left:60px; bottom:36px; width:100px;
    transition: left 0.9s cubic-bezier(.4,.1,.3,1);
  }
  #bike-wrap.spin .wheel-grp{ animation: spin 0.35s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #paper-toss{
    position:absolute; width:14px; height:10px; background:var(--paper);
    border:1px solid var(--ink); display:none; border-radius:2px;
  }
  #paper-toss.fly{
    display:block;
    animation: toss 0.5s ease-out forwards;
  }
  @keyframes toss{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(60px,-40px) rotate(200deg); opacity:0; }
  }

  /* ================= SANDBOX HUD extras ================= */
  .stat-pill{
    background:rgba(0,0,0,0.25);
    padding:2px 10px; border-radius:20px;
  }

  /* ================= END SCREEN ================= */
  #scene-summary{
    align-items:center; justify-content:center; text-align:center; gap:16px;
    background: linear-gradient(180deg, #1b2a4a 0%, #24365c 100%);
    color:var(--paper);
  }

  #footer-note{
    text-align:center; color:#7d8bab; font-size:11px; margin-top:8px;
    font-family:'Courier New', monospace;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--paper-line); border-radius:4px; }
</style>
</head>
<body>

<div id="cartridge">
  <div id="screen-area">

    <!-- TITLE -->
    <div class="scene active" id="scene-title">
      <div class="logo display">ROUTE RESOLVER</div>
      <div class="subtitle">a paper route game about how the internet finds things</div>
      <button class="big-btn" id="start-btn">▶ START ROUTE</button>
      <div class="press-start">use your mouse — no reading required, just click!</div>
    </div>

    <!-- CUTSCENE -->
    <div class="scene" id="scene-cutscene">
      <div class="cutscene-backdrop">
        <div class="badge-frame" id="portrait-frame"></div>
      </div>
      <div class="dialogue-box">
        <div class="speaker-tag" id="speaker-tag">ROSIE</div>
        <div class="dialogue-text" id="dialogue-text"></div>
        <div class="dialogue-footer">
          <span class="advance-hint">click anywhere to continue</span>
          <button class="big-btn secondary" id="skip-btn" style="font-size:11px; padding:6px 12px;">skip ▶▶</button>
        </div>
      </div>
    </div>

    <!-- PLAY -->
    <div class="scene" id="scene-play">
      <div class="play-topbar">
        <div>ROUTE RESOLVER — <span class="lvl-name" id="lvl-name">LEVEL 1</span></div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="stat-pill" id="score-pill">DELIVERED: 0</div>
          <button class="big-btn secondary" id="end-session-btn" style="display:none; font-size:11px; padding:6px 12px;">🏁 END SESSION</button>
        </div>
      </div>
      <div class="play-body">
        <div id="route-list-panel">
          <h3>TODAY'S LIST</h3>
          <ul id="route-list"></ul>
        </div>

        <div id="resolver-panel">
          <div id="device-svg-wrap"></div>
          <button class="big-btn" id="resolve-btn">RESOLVE</button>
          <button id="irl-toggle">❓ what's this like IRL?</button>
          <div id="irl-note"></div>
        </div>

        <div id="street-panel">
          <div class="road-dashes"></div>
          <div id="mailbox-slot"></div>
          <div id="bike-wrap"></div>
          <div id="paper-toss"></div>
          <div id="house-slot" class="unknown">
            <div class="delivered-badge">✓</div>
            <div id="house-svg-wrap"></div>
            <div class="addr-plate" id="addr-plate">?</div>
          </div>
        </div>
      </div>
    </div>

    <!-- SUMMARY / SANDBOX MENU -->
    <div class="scene" id="scene-summary">
      <div class="display" style="font-size:26px;color:var(--porch);">ROUTE COMPLETE!</div>
      <div id="summary-text" style="max-width:420px; font-size:14px; line-height:1.5;"></div>
      <div style="display:flex; gap:14px;">
        <button class="big-btn green" id="sandbox-btn">🎲 FREE PLAY</button>
        <button class="big-btn secondary" id="replay-btn">↻ REPLAY FROM START</button>
      </div>
    </div>

  </div>
  <div id="footer-note">a tiny game about DNS · built with Claude</div>
</div>

<script>
/* ============================================================
   PIXEL / RETRO SVG SPRITES
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";

function svg(viewBox, inner, extraAttrs=""){
  return `<svg viewBox="${viewBox}" xmlns="${NS}" shape-rendering="crispEdges" ${extraAttrs}>${inner}</svg>`;
}

function houseSVG(){
  return svg("0 0 140 120", `
    <polygon class="roof" points="8,56 70,8 132,56" fill="var(--roof)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
    <rect class="wall" x="14" y="56" width="112" height="54" fill="var(--paper)" stroke="var(--ink)" stroke-width="5"/>
    <rect x="60" y="80" width="22" height="30" fill="var(--ink)"/>
    <rect class="lit" id="winL" x="26" y="66" width="22" height="20" fill="var(--porch)" stroke="var(--ink)" stroke-width="3"/>
    <rect class="lit" id="winR" x="94" y="66" width="22" height="20" fill="var(--porch)" stroke="var(--ink)" stroke-width="3"/>
    <rect x="98" y="16" width="12" height="20" fill="var(--roof)" stroke="var(--ink)" stroke-width="3"/>
  `, 'width="150"');
}

function mailboxSVG(){
  return svg("0 0 40 70", `
    <rect x="17" y="20" width="6" height="46" fill="var(--ink)"/>
    <rect x="4" y="6" width="32" height="20" rx="10" fill="var(--paper)" stroke="var(--ink)" stroke-width="4"/>
    <rect x="4" y="14" width="32" height="12" fill="var(--street)" stroke="var(--ink)" stroke-width="0"/>
  `, 'width="46"');
}

function bikeSVG(){
  return svg("0 0 130 80", `
    <g class="wheel-grp" style="transform-origin:26px 58px;">
      <circle cx="26" cy="58" r="17" fill="none" stroke="var(--ink)" stroke-width="5"/>
      <line x1="26" y1="41" x2="26" y2="75" stroke="var(--ink)" stroke-width="3"/>
      <line x1="9" y1="58" x2="43" y2="58" stroke="var(--ink)" stroke-width="3"/>
    </g>
    <g class="wheel-grp" style="transform-origin:104px 58px;">
      <circle cx="104" cy="58" r="17" fill="none" stroke="var(--ink)" stroke-width="5"/>
      <line x1="104" y1="41" x2="104" y2="75" stroke="var(--ink)" stroke-width="3"/>
      <line x1="87" y1="58" x2="121" y2="58" stroke="var(--ink)" stroke-width="3"/>
    </g>
    <polyline points="26,58 55,58 70,26 88,58 104,58" fill="none" stroke="var(--bike)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="26" x2="60" y2="14" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="10" r="9" fill="#f0d8b0" stroke="var(--ink)" stroke-width="3"/>
    <path d="M48,10 a10,10 0 0 1 20,0" fill="var(--ink)"/>
    <rect x="46" y="19" width="24" height="20" rx="4" fill="var(--porch)" stroke="var(--ink)" stroke-width="3"/>
    <rect id="basketPaper" x="90" y="30" width="18" height="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
    <rect x="86" y="42" width="26" height="10" fill="none" stroke="var(--ink)" stroke-width="3"/>
  `, 'width="110"');
}

function deviceSVG(){
  return svg("0 0 100 150", `
    <rect x="4" y="4" width="92" height="142" rx="10" fill="var(--shell)" stroke="var(--ink)" stroke-width="4"/>
    <rect x="14" y="21" width="72" height="52" fill="var(--screen-bg)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="30" cy="102" r="9" fill="var(--bike)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="70" cy="102" r="9" fill="var(--cache)" stroke="var(--ink)" stroke-width="3"/>
    <rect x="30" y="120" width="40" height="7" rx="3" fill="var(--shell-dark)"/>
    <line x1="72" y1="4" x2="86" y2="-14" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  `, 'width="150"');
}

function portraitSVG(who){
  const cap = who === 'rosie' ? '#3d6b8f' : '#6b8f4a';
  return svg("0 0 100 100", `
    <rect width="100" height="100" fill="var(--paper)"/>
    <circle cx="50" cy="58" r="30" fill="#f0d8b0" stroke="var(--ink)" stroke-width="4"/>
    <path d="M18,50 a32,32 0 0 1 64,0 v-6 h-64 z" fill="${cap}" stroke="var(--ink)" stroke-width="4"/>
    <circle cx="38" cy="58" r="4" fill="var(--ink)"/>
    <circle cx="62" cy="58" r="4" fill="var(--ink)"/>
    <path d="M38,74 q12,10 24,0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
  `, 'width="100"');
}

/* ============================================================
   GAME DATA
   ============================================================ */
const STREETS = ["MAPLE ST","OAK AVE","PINE RD","ELM WAY","CEDAR LN","BIRCH CT","9TH AVE","RIVER RD"];
const NAME_POOL = ["BUDDY","JAMES","ELROY","NINA","OSCAR","PRIYA","TOMAS","LUZ"];

const addressBook = {};
const usedAddresses = new Set();

function assignAddress(name){
  if(addressBook[name]) return addressBook[name];
  let addr;
  do{
    const num = 100 + Math.floor(Math.random()*880);
    const street = STREETS[Math.floor(Math.random()*STREETS.length)];
    addr = `${num} ${street}`;
  } while(usedAddresses.has(addr));
  usedAddresses.add(addr);
  addressBook[name] = addr;
  return addr;
}

const LEVELS = [
  {
    key:'level1',
    label:'LEVEL 1 · FIRST LOOKUPS',
    queue:['BUDDY','JAMES','ELROY'],
    irlNote:"Just like typing a website name into your browser — your computer doesn't know the address either, until DNS looks it up."
  },
  {
    key:'level2',
    label:'LEVEL 2 · CACHING',
    queue:['BUDDY','NINA','JAMES','ELROY'],
    irlNote:"This is exactly why a website you've already visited today can load faster the second time — your computer cached the address!"
  }
];

const DIALOGUES = {
  intro:[
    {who:'rosie', text:"Hey, new kid! First day on the paper route, huh?"},
    {who:'rosie', text:"Here's today's list — Buddy, James, and Elroy all need their paper."},
    {who:'rookie', text:"Uh... where do they even live?"},
    {who:'rosie', text:"That's the thing — YOU don't know. But your gadget does."},
    {who:'rosie', text:"This is the Resolver. Type in a name, and it finds the address."},
    {who:'rosie', text:"Real computers use something just like it, called DNS — the Domain Name System. It turns names into addresses computers can actually find."},
    {who:'rosie', text:"Give it a try — let's get these papers delivered!"}
  ],
  mid:[
    {who:'rosie', text:"Nice riding! Notice how the Resolver had to think for a second on every name?"},
    {who:'rosie', text:"Today's list has some repeats. Watch what happens when you look someone up twice."},
    {who:'rosie', text:"Once the Resolver's found an address, it remembers it. That's called CACHING."},
    {who:'rosie', text:"Cached names pop up instantly — no waiting around. Let's see it in action."}
  ],
  end:[
    {who:'rosie', text:"You've got it! Look it up once, cache it, and delivery is instant from then on."},
    {who:'rosie', text:"That's exactly how the internet finds websites — instead of house numbers, it's looking up IP addresses."},
    {who:'rosie', text:"Want to keep riding? Free Play has an endless route — new names and cached ones, all mixed together."},
    {who:'rosie', text:"Go get 'em, champ."}
  ]
};

/* ============================================================
   STATE
   ============================================================ */
let state = {
  screen:'title',
  levelIdx:0,
  queue:[],
  currentPos:0,
  resolved:false,
  cached:false,
  score:0,
  sandbox:false,
  sandboxCount:0
};

/* ============================================================
   DOM HELPERS
   ============================================================ */
const $ = sel => document.querySelector(sel);
function showScene(id){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ============================================================
   CUTSCENE ENGINE
   ============================================================ */
let dlgLines = [];
let dlgIdx = 0;
let dlgOnDone = null;
let typing = null;

function playCutscene(key, onDone){
  dlgLines = DIALOGUES[key];
  dlgIdx = 0;
  dlgOnDone = onDone;
  showScene('#scene-cutscene');
  renderDialogueLine();
}

function renderDialogueLine(){
  const line = dlgLines[dlgIdx];
  $('#speaker-tag').textContent = line.who === 'rosie' ? 'ROSIE' : 'ROOKIE (YOU)';
  $('#portrait-frame').innerHTML = portraitSVG(line.who);
  const el = $('#dialogue-text');
  el.textContent = '';
  clearInterval(typing);
  let i = 0;
  typing = setInterval(()=>{
    el.textContent = line.text.slice(0, i+1);
    i++;
    if(i >= line.text.length) clearInterval(typing);
  }, 16);
}

function advanceDialogue(){
  // if mid-type, finish immediately
  const line = dlgLines[dlgIdx];
  if($('#dialogue-text').textContent !== line.text){
    clearInterval(typing);
    $('#dialogue-text').textContent = line.text;
    return;
  }
  dlgIdx++;
  if(dlgIdx >= dlgLines.length){
    dlgOnDone && dlgOnDone();
  } else {
    renderDialogueLine();
  }
}

$('#scene-cutscene').addEventListener('click', (e)=>{
  if(e.target.id === 'skip-btn') return;
  advanceDialogue();
});
$('#skip-btn').addEventListener('click', ()=>{
  clearInterval(typing);
  dlgOnDone && dlgOnDone();
});

/* ============================================================
   PLAY LOOP
   ============================================================ */
function initDeviceAndSprites(){
  $('#device-svg-wrap').innerHTML = deviceSVG();
  $('#device-svg-wrap').insertAdjacentHTML('beforeend', '<div id="resolver-screen"></div>');
  $('#mailbox-slot').innerHTML = mailboxSVG();
  $('#bike-wrap').innerHTML = bikeSVG();
  $('#house-svg-wrap').innerHTML = houseSVG();
}

function startLevel(levelIdx){
  state.screen = 'play';
  state.levelIdx = levelIdx;
  state.sandbox = false;
  const level = LEVELS[levelIdx];
  state.queue = level.queue.map(name => ({name, delivered:false}));
  state.currentPos = 0;
  state.score = 0;
  $('#lvl-name').textContent = level.label;
  $('#irl-note').textContent = level.irlNote;
  $('#irl-note').classList.remove('show');
  $('#end-session-btn').style.display = 'none';
  initDeviceAndSprites();
  showScene('#scene-play');
  loadCurrentSubscriber();
}

function startSandbox(){
  state.screen = 'play';
  state.sandbox = true;
  state.queue = [];
  state.currentPos = 0;
  state.score = 0;
  state.sandboxCount = 0;
  $('#lvl-name').textContent = 'FREE PLAY';
  $('#irl-note').textContent = "Mixing new lookups and cached ones — just like real web traffic!";
  $('#irl-note').classList.remove('show');
  $('#end-session-btn').style.display = 'inline-block';
  initDeviceAndSprites();
  pushSandboxSubscriber();
  showScene('#scene-play');
  loadCurrentSubscriber();
}

function pushSandboxSubscriber(){
  const knownNames = Object.keys(addressBook);
  const unknownNames = NAME_POOL.filter(n => !addressBook[n]);
  let pick;
  if(unknownNames.length && (Math.random() < 0.45 || knownNames.length === 0)){
    pick = unknownNames[Math.floor(Math.random()*unknownNames.length)];
  } else {
    pick = knownNames[Math.floor(Math.random()*knownNames.length)];
  }
  state.queue.push({name:pick, delivered:false});
}

function renderRouteList(){
  const ul = $('#route-list');
  ul.innerHTML = '';
  state.queue.forEach((sub, i)=>{
    const li = document.createElement('li');
    if(sub.delivered) li.classList.add('done');
    if(i === state.currentPos && !sub.delivered) li.classList.add('current');
    const isCached = !!addressBook[sub.name] && i !== state.currentPos ? true : false;
    li.innerHTML = `<span>${sub.name}</span>` + (addressBook[sub.name] ? `<span class="tag">${sub.delivered?'DONE':'CACHED'}</span>` : '');
    ul.appendChild(li);
  });
  $('#score-pill').textContent = `DELIVERED: ${state.score}`;
}

function loadCurrentSubscriber(){
  renderRouteList();
  const sub = state.queue[state.currentPos];
  if(!sub){ return; }
  $('#resolve-btn').disabled = false;
  state.resolved = false;
  state.cached = !!addressBook[sub.name];

  $('#house-slot').classList.remove('delivered');
  $('#house-slot').classList.add('unknown');
  $('#addr-plate').textContent = '?';
  $('#bike-wrap').style.left = '60px';
  $('#bike-wrap').classList.remove('spin');
  $('#basketPaper') && null;

  const screen = $('#resolver-screen');
  if(state.cached){
    screen.innerHTML = `LOOKUP: ${sub.name}\n<span style="color:var(--cache)">✓ CACHED</span>\n${addressBook[sub.name]}`;
    $('#resolve-btn').textContent = 'DELIVER →';
    state.resolved = true;
  } else {
    screen.innerHTML = `LOOKUP: ${sub.name}\nready<span class="cursor">_</span>`;
    $('#resolve-btn').textContent = 'RESOLVE';
  }
}

function doResolve(){
  const sub = state.queue[state.currentPos];
  if(!sub) return;

  if(state.resolved){
    // deliver
    deliverToHouse(sub);
    return;
  }

  // run lookup animation
  const screen = $('#resolver-screen');
  $('#resolve-btn').disabled = true;
  let dots = 0;
  screen.innerHTML = `LOOKUP: ${sub.name}\nRESOLVING<span id="dots"></span>`;
  const dotTimer = setInterval(()=>{
    dots = (dots+1) % 4;
    const d = $('#dots');
    if(d) d.textContent = '.'.repeat(dots);
  }, 200);

  setTimeout(()=>{
    clearInterval(dotTimer);
    const addr = assignAddress(sub.name);
    screen.innerHTML = `LOOKUP: ${sub.name}\n<span style="color:var(--cache)">→ FOUND!</span>\n${addr}`;
    state.resolved = true;
    $('#resolve-btn').disabled = false;
    $('#resolve-btn').textContent = 'DELIVER →';

    $('#house-slot').classList.remove('unknown');
    $('#addr-plate').textContent = addr;
    renderRouteList();
  }, 900);
}

function deliverToHouse(sub){
  $('#resolve-btn').disabled = true;
  $('#bike-wrap').classList.add('spin');
  $('#bike-wrap').style.left = '380px';

  setTimeout(()=>{
    // paper toss
    const toss = $('#paper-toss');
    const bikeRect = $('#bike-wrap').getBoundingClientRect();
    const streetRect = $('#street-panel').getBoundingClientRect();
    toss.style.left = (bikeRect.left - streetRect.left + 70) + 'px';
    toss.style.top = (bikeRect.top - streetRect.top + 30) + 'px';
    toss.classList.remove('fly');
    void toss.offsetWidth;
    toss.classList.add('fly');

    $('#bike-wrap').classList.remove('spin');
    $('#house-slot').classList.add('delivered');
    sub.delivered = true;
    state.score++;
    renderRouteList();

    setTimeout(()=>{
      advanceQueue();
    }, 700);
  }, 950);
}

function advanceQueue(){
  if(state.sandbox){
    state.currentPos++;
    state.sandboxCount++;
    pushSandboxSubscriber();
    loadCurrentSubscriber();
    $('#resolve-btn').disabled = false;
    return;
  }
  state.currentPos++;
  if(state.currentPos >= state.queue.length){
    finishLevel();
  } else {
    loadCurrentSubscriber();
    $('#resolve-btn').disabled = false;
  }
}

function finishLevel(){
  const idx = state.levelIdx;
  if(idx === 0){
    playCutscene('mid', ()=> startLevel(1));
  } else {
    playCutscene('end', ()=> showSummary('levels'));
  }
}

function showSummary(context){
  showScene('#scene-summary');
  if(context === 'sandbox'){
    $('#summary-text').textContent = `Free Play wrap-up: you delivered ${state.score} papers, mixing fresh lookups with cached ones. That's the DNS pattern in a nutshell!`;
    $('#sandbox-btn').textContent = '🎲 KEEP PLAYING';
  } else {
    $('#summary-text').textContent = "You resolved every name on the route and cached the rest. That's the whole idea behind DNS — look it up once, remember it forever (well, for a while)!";
    $('#sandbox-btn').textContent = '🎲 FREE PLAY';
  }
}

$('#resolve-btn').addEventListener('click', doResolve);
$('#irl-toggle').addEventListener('click', ()=>{
  $('#irl-note').classList.toggle('show');
});
$('#end-session-btn').addEventListener('click', ()=>{
  showSummary('sandbox');
});

/* ============================================================
   NAV / BOOT
   ============================================================ */
$('#start-btn').addEventListener('click', ()=>{
  playCutscene('intro', ()=> startLevel(0));
});
$('#sandbox-btn').addEventListener('click', startSandbox);
$('#replay-btn').addEventListener('click', ()=>{
  Object.keys(addressBook).forEach(k=>delete addressBook[k]);
  usedAddresses.clear();
  showScene('#scene-title');
});

</script>
